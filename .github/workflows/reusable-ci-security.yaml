name: GitHub Actions Security Analysis

on:
  workflow_call:
    inputs:
      min-severity:
        description: "Only show results at or above this severity [possible values: unknown, informational, low, medium, high]"
        required: false
        type: string
        default: "low"
      min-confidence:
        description: "Only show results at or above this confidence level [possible values: unknown, low, medium, high]"
        required: false
        type: string
        default: "low"
      fail-on-findings:
        description: "Fail the workflow when zizmor finds issues"
        required: false
        type: boolean
        default: true
      zizmor-version:
        description: "Version of zizmor to install, for example v1.32.0 or latest. Empty uses the version pinned in this workflow"
        type: string
        default: ""
        required: false
      zizmor-args:
        description: "Additional arguments to pass to zizmor"
        type: string
        default: ""
        required: false
      always-use-default-config:
        description: "Always use the shared default config, even if the caller repo has its own"
        type: boolean
        default: false
        required: false
    secrets:
      token:
        description: "GitHub token for zizmor to use for API calls (defaults to GITHUB_TOKEN)"
        required: false

# Ensure that default `GITHUB_TOKEN` doesn't have any permissions.
permissions: {}

jobs:
  # Resolve which ref of shared-workflows was called so we can fetch the
  # default zizmor config from the same version. Uses the OIDC token's
  # job_workflow_ref claim. Runs in a separate job to keep id-token: write
  # scoped away from the main analysis job.
  resolve-workflow-ref:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    outputs:
      owner: ${{ steps.resolve.outputs.owner }}
      repo: ${{ steps.resolve.outputs.repo }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: resolve workflow ref via OIDC
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          FALLBACK_OWNER: luxass
          FALLBACK_REPO: shared-workflows
        run: |
          set -euo pipefail

          FALLBACK_SHA="main"

          fallback() {
            echo "::warning::$1 Using fallback."
            echo "owner=${FALLBACK_OWNER}" >> "$GITHUB_OUTPUT"
            echo "repo=${FALLBACK_REPO}" >> "$GITHUB_OUTPUT"
            echo "sha=${FALLBACK_SHA}" >> "$GITHUB_OUTPUT"
            exit 0
          }

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            fallback "No OIDC token available (e.g. fork PR)."
          fi

          # Request OIDC token
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=zizmor-workflow-ref" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            fallback "Failed to retrieve OIDC token."
          fi

          # Decode JWT payload (second segment, base64url → base64 with padding)
          B64=$(echo "$OIDC_TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( 4 - ${#B64} % 4 ))
          [ "$PAD" -lt 4 ] && B64="${B64}$(printf '=%.0s' $(seq 1 "$PAD"))"
          PAYLOAD=$(echo "$B64" | base64 -d)

          JOB_REF=$(echo "$PAYLOAD" | jq -r '.job_workflow_ref // empty')
          if [ -z "$JOB_REF" ]; then
            fallback "job_workflow_ref claim not found."
          fi

          # Parse: owner/repo/.github/workflows/file.yml@ref
          OWNER=$(echo "$JOB_REF" | cut -d/ -f1)
          REPO=$(echo "$JOB_REF" | cut -d/ -f2)
          GIT_REF=$(echo "$JOB_REF" | sed 's/.*@//')

          # Resolve ref to SHA for cache stability
          SHA="$GIT_REF"
          if echo "$GIT_REF" | grep -q '^refs/'; then
            REF_PATH="${GIT_REF#refs/}"
            SHA=$(gh api "repos/${OWNER}/${REPO}/git/ref/${REF_PATH}" -q '.object.sha')
          fi

          echo "Resolved: ${OWNER}/${REPO}@${SHA}"
          echo "owner=${OWNER}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

  zizmor:
    name: zizmor
    needs: resolve-workflow-ref
    runs-on: ubuntu-slim
    permissions:
      actions: read
      security-events: write
      contents: read
    env:
      # Updated by Renovate (customManagers:githubActionsVersions).
      # renovate: datasource=github-releases depName=zizmorcore/zizmor
      ZIZMOR_DEFAULT_VERSION: v1.32.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: restore config from cache
        id: cache-config
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/zizmor.yml
          key: zizmor-config-${{ needs.resolve-workflow-ref.outputs.owner }}-${{ needs.resolve-workflow-ref.outputs.repo }}-${{ needs.resolve-workflow-ref.outputs.sha }}

      - name: fetch default config
        if: steps.cache-config.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_OWNER: ${{ needs.resolve-workflow-ref.outputs.owner }}
          CONFIG_REPO: ${{ needs.resolve-workflow-ref.outputs.repo }}
          CONFIG_SHA: ${{ needs.resolve-workflow-ref.outputs.sha }}
        run: |
          set -euo pipefail

          RESPONSE=$(gh api "repos/${CONFIG_OWNER}/${CONFIG_REPO}/contents/.github/zizmor.yml?ref=${CONFIG_SHA}" 2>/dev/null) || {
            echo "::warning::No default zizmor config found in ${CONFIG_OWNER}/${CONFIG_REPO}@${CONFIG_SHA}."
            exit 0
          }

          echo "$RESPONSE" | jq -r '.content' | base64 -d > "${{ runner.temp }}/zizmor.yml"
          echo "Default config fetched from ${CONFIG_OWNER}/${CONFIG_REPO}@${CONFIG_SHA}"

      - name: resolve config
        id: config
        env:
          FORCE_DEFAULT: ${{ inputs.always-use-default-config && 'true' || '' }}
        run: |
          if [ -z "$FORCE_DEFAULT" ]; then
            if [ -f ".github/zizmor.yml" ]; then
              echo "Using caller's .github/zizmor.yml"
              echo "path=.github/zizmor.yml" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -f "zizmor.yml" ]; then
              echo "Using caller's zizmor.yml"
              echo "path=zizmor.yml" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          CONFIG_PATH="${{ runner.temp }}/zizmor.yml"
          if [ -f "$CONFIG_PATH" ]; then
            echo "Using shared default config"
            echo "path=${CONFIG_PATH}" >> "$GITHUB_OUTPUT"
          else
            echo "No config found, using zizmor defaults"
          fi

      - name: resolve zizmor version
        id: zizmor-version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.zizmor-version }}
        run: |
          set -euo pipefail

          # Exact release tags only. This also keeps caller input out of API paths and file names.
          TAG_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'

          # The latest release is reused by the outdated check. Empty when the lookup fails.
          LATEST_TAG=$(gh api repos/zizmorcore/zizmor/releases/latest --jq '.tag_name' 2> /dev/null || true)
          if ! [[ "$LATEST_TAG" =~ $TAG_PATTERN ]]; then
            LATEST_TAG=""
          fi

          case "$REQUESTED_VERSION" in
            "")
              TAG="$ZIZMOR_DEFAULT_VERSION"
              ;;
            latest)
              if [ -z "$LATEST_TAG" ]; then
                echo "::error::Could not resolve the latest zizmor release. Set zizmor-version to an exact version, for example v1.32.0."
                exit 1
              fi
              TAG="$LATEST_TAG"
              ;;
            *)
              TAG="v${REQUESTED_VERSION#v}"
              ;;
          esac

          if ! [[ "$TAG" =~ $TAG_PATTERN ]]; then
            echo "::error::Invalid zizmor-version. Use an exact version such as v1.32.0, latest, or leave it empty."
            exit 1
          fi

          echo "Using zizmor ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "latest-tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

      # Advisory only: Renovate updates the pin in shared-workflows, but callers can run an
      # older shared-workflows release or set zizmor-version themselves. Never fails the job.
      - name: check zizmor version
        continue-on-error: true
        env:
          TAG: ${{ steps.zizmor-version.outputs.tag }}
          LATEST_TAG: ${{ steps.zizmor-version.outputs.latest-tag }}
        run: |
          set -euo pipefail

          if [ -z "$LATEST_TAG" ]; then
            echo "Could not determine the latest zizmor release; skipping version check."
            exit 0
          fi

          NEWEST=$(printf '%s\n%s\n' "${TAG#v}" "${LATEST_TAG#v}" | sort -V | tail -n 1)
          if [ "$NEWEST" != "${TAG#v}" ]; then
            echo "::warning title=zizmor is outdated::Using zizmor ${TAG}, but ${LATEST_TAG} is the latest release. Update the zizmor-version input, or update luxass/shared-workflows."
          else
            echo "zizmor ${TAG} is up to date (latest release: ${LATEST_TAG})."
          fi

      # Downloads the release binary and verifies its signed build provenance before use:
      # it must be built by zizmor's release workflow, from this exact tag, on a GitHub-hosted
      # runner. Not cached, so a cached binary can never skip verification.
      - name: install zizmor
        id: install-zizmor
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.zizmor-version.outputs.tag }}
        run: |
          set -euo pipefail

          if [ "$RUNNER_OS" != Linux ]; then
            echo "::error::zizmor installation supports Linux runners only, not ${RUNNER_OS}."
            exit 1
          fi
          case "$RUNNER_ARCH" in
            X64) ARCH=x86_64 ;;
            ARM64) ARCH=aarch64 ;;
            *)
              echo "::error::Unsupported runner architecture for zizmor: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac

          ASSET="zizmor-${ARCH}-unknown-linux-gnu.tar.gz"
          INSTALL_DIR=$(mktemp -d "${RUNNER_TEMP}/zizmor.XXXXXX")

          if ! gh release download "$TAG" --repo zizmorcore/zizmor --pattern "$ASSET" --dir "$INSTALL_DIR"; then
            echo "::error::Could not download ${ASSET} from zizmor ${TAG}. Older zizmor releases have no Linux binaries; use a newer zizmor-version."
            exit 1
          fi

          if ! gh attestation verify "${INSTALL_DIR}/${ASSET}" \
            --repo zizmorcore/zizmor \
            --signer-workflow zizmorcore/zizmor/.github/workflows/release-binaries.yml \
            --source-ref "refs/tags/${TAG}" \
            --deny-self-hosted-runners; then
            echo "::error::Build provenance verification failed for ${ASSET} from zizmor ${TAG}. Refusing to run it."
            exit 1
          fi

          # Extract only the zizmor executable and reject anything that is not a regular file.
          tar -xzf "${INSTALL_DIR}/${ASSET}" -C "$INSTALL_DIR" --no-same-owner zizmor
          ZIZMOR_BIN="${INSTALL_DIR}/zizmor"
          if [ -L "$ZIZMOR_BIN" ] || [ ! -f "$ZIZMOR_BIN" ]; then
            echo "::error::The zizmor archive did not contain a regular zizmor executable."
            exit 1
          fi
          chmod 0755 "$ZIZMOR_BIN"

          INSTALLED_VERSION=$("$ZIZMOR_BIN" --version)
          if [ "$INSTALLED_VERSION" != "zizmor ${TAG#v}" ]; then
            echo "::error::Expected zizmor ${TAG#v}, but the binary reports: ${INSTALLED_VERSION}"
            exit 1
          fi

          echo "Installed and verified ${INSTALLED_VERSION}"
          echo "path=${ZIZMOR_BIN}" >> "$GITHUB_OUTPUT"

      - name: run zizmor
        id: zizmor
        env:
          GH_TOKEN: ${{ secrets.token || github.token }}
          ZIZMOR_BIN: ${{ steps.install-zizmor.outputs.path }}
          ZIZMOR_ARGS: ${{ inputs.zizmor-args }}
          ZIZMOR_CONFIG_PATH: ${{ steps.config.outputs.path }}
          MIN_SEVERITY: ${{ inputs.min-severity }}
          MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        run: |
          set +e
          "$ZIZMOR_BIN" \
            --format sarif \
            --min-severity "${MIN_SEVERITY}" \
            --min-confidence "${MIN_CONFIDENCE}" \
            ${ZIZMOR_CONFIG_PATH:+--config "$ZIZMOR_CONFIG_PATH"} \
            ${RUNNER_DEBUG:+"--verbose"} \
            ${ZIZMOR_ARGS:+${ZIZMOR_ARGS}} \
            . \
            > results.sarif
          exit_code=$?
          set -e

          # Only fail on exit code 1 (zizmor crash). 0 = no findings, 10-14 = findings by severity.
          if [ "${exit_code}" -eq 1 ]; then exit 1; fi
          echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: upload sarif file
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: fail on findings
        if: ${{ inputs.fail-on-findings && steps.zizmor.outputs.exit-code >= 10 && steps.zizmor.outputs.exit-code <= 14 }}
        env:
          EXIT_CODE: ${{ steps.zizmor.outputs.exit-code }}
        run: exit "$EXIT_CODE"
