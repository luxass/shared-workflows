name: Discord forum alert

on:
  workflow_call:
    inputs:
      title:
        description: "New forum post title, 1-100 characters"
        type: string
        required: true
      summary:
        description: "Initial post content, 1-2000 characters"
        type: string
        required: true
      applied-tags:
        description: "JSON array of tag ID strings from the webhook's forum; at least one required"
        type: string
        required: true
    secrets:
      webhook-url:
        description: "Incoming webhook URL scoped to the alerts forum; skips when unavailable"
        required: false

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: create forum post
        shell: bash
        env:
          ALERT_TITLE: ${{ inputs.title }}
          ALERT_SUMMARY: ${{ inputs.summary }}
          ALERT_TAGS: ${{ inputs.applied-tags }}
          DISCORD_WEBHOOK_URL: ${{ secrets.webhook-url }}
        run: |
          set -euo pipefail
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "Discord alert skipped: webhook secret unavailable."
            exit 0
          fi

          if [[ ! "$DISCORD_WEBHOOK_URL" =~ ^https://discord\.com/api/(v[0-9]+/)?webhooks/[0-9]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Expected a Discord incoming webhook URL without query parameters."
            exit 1
          fi

          if ! payload=$(jq -cen '
            env.ALERT_TITLE as $title |
            env.ALERT_SUMMARY as $summary |
            (env.ALERT_TAGS | fromjson) as $tags |
            if ($title | length) < 1 or ($title | length) > 100 or
               ($summary | length) < 1 or ($summary | length) > 2000 then
              error("Invalid title or summary length")
            elif ($tags | type) != "array" then
              error("Tags must be an array")
            elif ($tags | length) < 1 or ($tags | length) > 5 then
              error("Provide 1-5 tags")
            elif (all($tags[]; type == "string") | not) then
              error("Tag IDs must be strings")
            elif (all($tags[]; test("^[0-9]+$")) | not) then
              error("Tag IDs must be numeric")
            else
              {thread_name: $title, content: $summary, applied_tags: $tags,
               allowed_mentions: {parse: []}}
            end
          ' 2>/dev/null); then
            echo "::error::Provide a title of 1-100 characters, a summary of 1-2000 characters, and a JSON array of 1-5 tag ID strings."
            exit 1
          fi

          # Pass the credential-bearing URL on stdin, not in curl's arguments.
          # Ignore curlrc, never follow redirects, and make only one attempt.
          if ! status=$(
            printf 'url = "%s?wait=true"\n' "$DISCORD_WEBHOOK_URL" |
              curl --disable --config - --silent \
                --proto '=https' --retry 0 \
                --connect-timeout 10 --max-time 30 \
                --request POST --header 'Content-Type: application/json' \
                --data-binary "$payload" \
                --output /dev/null --write-out '%{http_code}' 2>/dev/null
          ); then
            echo "::error::Discord alert request failed; delivery is uncertain and was not retried."
            exit 1
          fi

          if [[ ! "$status" =~ ^2[0-9]{2}$ ]]; then
            echo "::error::Discord alert failed with HTTP status $status; not retried."
            exit 1
          fi
          echo "Discord forum post created."
