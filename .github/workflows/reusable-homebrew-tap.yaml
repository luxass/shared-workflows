name: update homebrew tap formula

on:
  workflow_call:
    inputs:
      tap-repository:
        description: "Homebrew tap repository (e.g. luxass/homebrew-tap)"
        type: string
        required: true
      formula-path:
        description: "Path to the formula file in the tap repo"
        type: string
        required: true
      formula-name:
        description: "Name of the formula (used for sha-update-id markers)"
        type: string
        required: true
      cask-path:
        description: "Optional path to a cask file in the tap repository"
        type: string
        default: ""
        required: false
      cask-name:
        description: "Release ZIP name prefix and cask checksum marker prefix"
        type: string
        default: ""
        required: false
      cask-target:
        description: "Release ZIP target suffix for the cask"
        type: string
        default: ""
        required: false
      base-branch:
        description: "Base branch for the PR"
        type: string
        default: "main"
        required: false
      environment:
        description: "GitHub environment to use"
        type: string
        default: "homebrew-tap"
        required: false
      targets:
        description: "JSON array of targets to update checksums for"
        type: string
        required: true
      git-user-name:
        description: "Git user name for the commit"
        type: string
        default: "luxass-homebrew"
        required: false
      git-user-email:
        description: "Git user email for the commit"
        type: string
        default: "luxass-homebrew[bot]@users.noreply.github.com"
        required: false
    secrets:
      token:
        description: "GitHub token for tap repo access (use if not using GitHub App)"
        required: false
      app-id:
        description: "GitHub App client ID for tap repo access"
        required: false
      app-private-key:
        description: "GitHub App private key for tap repo access"
        required: false

permissions: {}

jobs:
  update-formula:
    name: Update ${{ inputs.formula-name }} formula
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    permissions:
      contents: read
    steps:
      - name: validate auth
        id: auth
        env:
          TOKEN: ${{ secrets.token }}
          APP_ID: ${{ secrets.app-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "use-app-auth=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "use-app-auth=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$APP_ID" ] || [ -n "$APP_PRIVATE_KEY" ]; then
            echo "Both 'app-id' and 'app-private-key' must be provided together when not using 'token'" >&2
            exit 1
          fi

          echo "Either 'token' or both 'app-id' and 'app-private-key' must be provided" >&2
          exit 1

      - name: generate app token
        if: ${{ steps.auth.outputs.use-app-auth == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.tap-repository }}
          permission-contents: write
          permission-pull-requests: write

      - name: download release assets
        env:
          GH_TOKEN: ${{ secrets.token || steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mkdir -p assets
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D assets --pattern '*.tar.gz' --pattern '*.zip'

      - name: compute checksums
        id: checksums
        env:
          TARGETS: ${{ inputs.targets }}
          FORMULA_NAME: ${{ inputs.formula-name }}
          CASK_PATH: ${{ inputs.cask-path }}
          CASK_NAME: ${{ inputs.cask-name }}
          CASK_TARGET: ${{ inputs.cask-target }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          version="${version#*@}"

          while IFS= read -r target; do
            tarball="${FORMULA_NAME}-${version}-${target}.tar.gz"
            if [ -f "assets/${tarball}" ]; then
              sha=$(sha256sum "assets/${tarball}" | awk '{print $1}')
              echo "${target}=${sha}" >> "$GITHUB_OUTPUT"
            fi
          done < <(echo "$TARGETS" | jq -r '.[]')

          if [ -n "$CASK_PATH$CASK_NAME$CASK_TARGET" ]; then
            if [ -z "$CASK_PATH" ] || [ -z "$CASK_NAME" ] || [ -z "$CASK_TARGET" ]; then
              echo "cask-path, cask-name, and cask-target must be set together" >&2
              exit 1
            fi
            archive="${CASK_NAME}-${version}-${CASK_TARGET}.zip"
            if [ ! -f "assets/${archive}" ]; then
              echo "Missing release asset: ${archive}" >&2
              exit 1
            fi
            sha=$(sha256sum "assets/${archive}" | awk '{print $1}')
            echo "cask=${sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: clone homebrew-tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.tap-repository }}
          token: ${{ secrets.token || steps.app-token.outputs.token }}
          path: tap
          # We need to persist credentials here to be able to push the update
          # branch later. The token is scoped with write permissions to only
          # the tap repository to limit the blast radius in case of issues.
          persist-credentials: true

      - name: update formula
        env:
          VERSION: ${{ github.event.release.tag_name }}
          FORMULA_PATH: ${{ inputs.formula-path }}
          FORMULA_NAME: ${{ inputs.formula-name }}
          TARGETS: ${{ inputs.targets }}
          CHECKSUMS: ${{ toJSON(steps.checksums.outputs) }}
        run: |
          set -euo pipefail
          formula="tap/${FORMULA_PATH}"
          version="${VERSION#v}"
          version="${version#*@}"

          if [ ! -f "$formula" ]; then
            echo "Formula not found at ${formula}" >&2
            exit 1
          fi

          while IFS= read -r target; do
            sha=$(echo "$CHECKSUMS" | jq -r ".\"$target\" // empty")
            if [ -n "$sha" ]; then
              sed -i "s|sha256 \"[a-f0-9]\{64\}\".*# sha-update-id: ${FORMULA_NAME}-${target}|sha256 \"${sha}\" # sha-update-id: ${FORMULA_NAME}-${target}|" "$formula"
            fi
          done < <(echo "$TARGETS" | jq -r '.[]')

          sed -i "s|version \".*\"|version \"${version}\"|" "$formula"

      - name: update cask
        if: ${{ inputs.cask-path != '' }}
        env:
          VERSION: ${{ github.event.release.tag_name }}
          CASK_PATH: ${{ inputs.cask-path }}
          CASK_NAME: ${{ inputs.cask-name }}
          CASK_TARGET: ${{ inputs.cask-target }}
          CASK_SHA: ${{ steps.checksums.outputs.cask }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("tap") / os.environ["CASK_PATH"]
          version = os.environ["VERSION"].removeprefix("v").split("@")[-1]
          sha = os.environ["CASK_SHA"]
          marker = f'{os.environ["CASK_NAME"]}-{os.environ["CASK_TARGET"]}'
          content = path.read_text()
          version_pattern = r'(?m)^  version "[^"]+"$'
          sha_pattern = rf'(?m)^  sha256 "[0-9a-f]{{64}}" # sha-update-id: {re.escape(marker)}$'
          content, version_count = re.subn(version_pattern, f'  version "{version}"', content)
          content, sha_count = re.subn(sha_pattern, f'  sha256 "{sha}" # sha-update-id: {marker}', content)
          if version_count != 1 or sha_count != 1:
              raise SystemExit(f"Expected one cask version and checksum marker in {path}; found {version_count} and {sha_count}")
          path.write_text(content)
          PY

      - name: create pr
        env:
          GH_TOKEN: ${{ secrets.token || steps.app-token.outputs.token }}
          TAG: ${{ github.event.release.tag_name }}
          FORMULA_NAME: ${{ inputs.formula-name }}
          CASK_NAME: ${{ inputs.cask-name }}
          CASK_TARGET: ${{ inputs.cask-target }}
          CASK_SHA: ${{ steps.checksums.outputs.cask }}
          BASE: ${{ inputs.base-branch }}
          TARGETS: ${{ inputs.targets }}
          CHECKSUMS: ${{ toJSON(steps.checksums.outputs) }}
          GIT_USER_NAME: ${{ inputs.git-user-name }}
          GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        run: |
          set -euo pipefail
          cd tap

          version="${TAG#v}"
          version="${version#*@}"
          branch="update-${FORMULA_NAME}-${version}"
          git checkout -b "$branch"
          git config user.email "$GIT_USER_EMAIL"
          git config user.name "$GIT_USER_NAME"
          git add -A
          git commit -m "chore: update ${FORMULA_NAME} to ${version}"
          git push origin "$branch"

          cask_summary=""
          if [ -n "$CASK_NAME" ]; then
            cask_summary=" and the \`${CASK_NAME}\` cask"
          fi
          body="## Summary

          Automated update of the \`${FORMULA_NAME}\` Homebrew formula${cask_summary} to \`${version}\`.

          ## Updated targets

          | Target | SHA256 |
          | --- | --- |"

          while IFS= read -r target; do
            sha=$(echo "$CHECKSUMS" | jq -r ".\"$target\" // empty")
            if [ -n "$sha" ]; then
              body="${body}
          | \`${target}\` | \`${sha}\` |"
            fi
          done < <(echo "$TARGETS" | jq -r '.[]')

          if [ -n "$CASK_NAME" ]; then
            body="${body}
          | \`${CASK_NAME}-${CASK_TARGET}.zip\` | \`${CASK_SHA}\` |"
          fi

          body="${body}

          ## Links

          - [Release ${TAG}](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})"

          gh pr create \
            --title "chore: update ${FORMULA_NAME} to ${version}" \
            --body "$body" \
            --base "$BASE" \
            --head "$branch"
