name: Release (npm)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "lts/*"
        required: false
      environment:
        description: "GitHub environment to use (must have NPM_CONFIG_PROVENANCE secrets etc.)"
        type: string
        default: "npm-registry"
        required: false
      build:
        description: "Run the build step before publishing"
        type: boolean
        default: true
        required: false
      build-script:
        description: "Arguments passed to pnpm for the build step"
        type: string
        default: "build"
        required: false
      recursive:
        description: "Publish all packages in the workspace (pnpm publish -r)"
        type: boolean
        default: false
        required: false
      publish-args:
        description: "Additional arguments to pass to pnpm publish"
        type: string
        default: "--access public --no-git-checks"
        required: false
      generate-changelog:
        description: "Generate changelog with changelogithub"
        type: boolean
        default: true
        required: false
      install-args:
        description: "Additional arguments to pass to pnpm install"
        type: string
        default: ""
        required: false
      stage:
        description: "Use pnpm stage publish instead of pnpm publish"
        type: boolean
        default: false
        required: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: generate changelog
        if: ${{ inputs.generate-changelog }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpx changelogithub

      - name: install dependencies
        uses: luxass/shared-workflows/actions/run-pnpm@82c9e3625f7959ea6b3ddd2014a8a095a269e8f7 # actions/run-pnpm/v0.2.1
        with:
          args: install --frozen-lockfile ${{ inputs.install-args }}

      - name: build
        if: ${{ inputs.build }}
        uses: luxass/shared-workflows/actions/run-pnpm@82c9e3625f7959ea6b3ddd2014a8a095a269e8f7 # actions/run-pnpm/v0.2.1
        with:
          args: ${{ inputs.build-script }}

      - name: detect tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)

          if [[ "$LATEST_TAG" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: publish to npm (staging)
        if: ${{ inputs.stage }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        uses: luxass/shared-workflows/actions/run-pnpm@82c9e3625f7959ea6b3ddd2014a8a095a269e8f7 # actions/run-pnpm/v0.2.1
        with:
          args: stage publish ${{ inputs.recursive && '-r' || '' }} --tag ${{ steps.tag.outputs.tag }} ${{ inputs.publish-args }}

      - name: publish to npm
        if: ${{ !inputs.stage }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        uses: luxass/shared-workflows/actions/run-pnpm@82c9e3625f7959ea6b3ddd2014a8a095a269e8f7 # actions/run-pnpm/v0.2.1
        with:
          args: publish ${{ inputs.recursive && '-r' || '' }} --tag ${{ steps.tag.outputs.tag }} ${{ inputs.publish-args }}
