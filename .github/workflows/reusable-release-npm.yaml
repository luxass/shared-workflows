name: Release (npm)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to use"
        type: string
        default: "lts/*"
        required: false
      environment:
        description: "GitHub environment to use (must have NPM_CONFIG_PROVENANCE secrets etc.)"
        type: string
        default: "npm-registry"
        required: false
      build:
        description: "Run the build step before publishing"
        type: boolean
        default: true
        required: false
      build-script:
        description: "Arguments passed to pnpm for the build step"
        type: string
        default: "build"
        required: false
      recursive:
        description: "Publish all packages in the workspace (pnpm publish -r)"
        type: boolean
        default: false
        required: false
      publish-args:
        description: "Additional arguments to pass to pnpm publish"
        type: string
        default: "--access public --no-git-checks"
        required: false
      generate-changelog:
        description: "Generate changelog with changelogithub"
        type: boolean
        default: true
        required: false
      install-args:
        description: "Additional arguments to pass to pnpm install"
        type: string
        default: ""
        required: false
      stage:
        description: "Use pnpm stage publish instead of pnpm publish"
        type: boolean
        default: false
        required: false

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: setup node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: update npm (oidc provenance)
        run: npm install -g npm@latest

      - name: generate changelog
        if: ${{ inputs.generate-changelog }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpx changelogithub

      - name: install dependencies
        uses: luxass/shared-workflows/actions/run-pnpm@b735646b0a4a26710ba55662e060fc6c45560ed8 # unreleased
        with:
          args: install --frozen-lockfile ${{ inputs.install-args }}

      - name: build
        if: ${{ inputs.build }}
        uses: luxass/shared-workflows/actions/run-pnpm@b735646b0a4a26710ba55662e060fc6c45560ed8 # unreleased
        with:
          args: ${{ inputs.build-script }}

      - name: detect tag
        id: tag
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0)

          if [[ "$LATEST_TAG" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: publish to npm (staging)
        if: ${{ inputs.stage }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        uses: luxass/shared-workflows/actions/run-pnpm@b735646b0a4a26710ba55662e060fc6c45560ed8 # unreleased
        with:
          args: stage publish ${{ inputs.recursive && '-r' || '' }} --tag ${{ steps.tag.outputs.tag }} ${{ inputs.publish-args }}

      - name: publish to npm
        if: ${{ !inputs.stage }}
        env:
          NPM_CONFIG_PROVENANCE: "true"
        uses: luxass/shared-workflows/actions/run-pnpm@b735646b0a4a26710ba55662e060fc6c45560ed8 # unreleased
        with:
          args: publish ${{ inputs.recursive && '-r' || '' }} --tag ${{ steps.tag.outputs.tag }} ${{ inputs.publish-args }}
