          packages: '[{"name":"@luxass/pi-btw","version":"0.2.2","npm-package-path":"%40luxass%2Fpi-btw","integrity":"sha512-aMsGm9ccb5P0WyCyYRzCgPcHEn2SJC24s5vXqYb8ZdgYi+NcGss9+GGFUas6lJ+iGje78nDIdhqf3dIPYCUIig=="},{"name":"@luxass/pi-questions","version":"0.2.0","npm-package-path":"%40luxass%2Fpi-questions","integrity":"sha512-hZh89JyH9ARXY+omvvjyrwNuNbZXkfrzIh6Q93XIXJWmD78mLQGAe01ui7E8nP1bRmElQRpnu8Q7GgyXu8XncA=="},{"name":"@luxass/pi-cost-explorer","version":"0.2.0","npm-package-path":"%40luxass%2Fpi-cost-explorer","integrity":"sha512-HWvC5MCY2FvCvxVN/5YjdoaKWdszz/UAgwf6g/jYR4ExVgMa3X78dI5EUllDgF7Opq19gyGjOqFAWUDfErdraQ=="},{"name":"@luxass/pi-subagents","version":"0.1.0","npm-package-path":"%40luxass%2Fpi-subagents","integrity":"sha512-lnE2S1ADfxvsWTTCLW/Zi0VytGrRoGcwE/r13NzJzVw5V2Jb6eFATFbZrF5YuCvBJWvPXHpwQ6O75gZS096g/Q=="}]'
          invocation-id: https://github.com/luxass/agent-extensions/actions/runs/44865055360/attempts/1
          repository: luxass/agent-extensions
          ref: refs/heads/main
          sha: dfa2c81
          max-attempts: "1"
          retry-seconds: "0"

      - name: refuse an empty package list
        id: no-packages
        continue-on-error: true
        uses: $/actions/verify-npm-packages
        with:
          packages: '[]'
          invocation-id: https://github.com/luxass/agent-extensions/actions/runs/44865055360/attempts/1
          repository: luxass/agent-extensions
          ref: refs/heads/main
          sha: dfa2c8168e8e905c3f84d02f29dd71b19dc54566
          max-attempts: "1"
          retry-seconds: "0"

      - name: check the rejections
        env:
          WRONG_ATTEMPT: ${{ toJSON(steps.wrong-attempt.outputs) }}
          SWAPPED_DIGESTS: ${{ toJSON(steps.swapped-digests.outputs) }}
          PARTIAL: ${{ toJSON(steps.partial.outputs) }}
          WRONG_COMMIT: ${{ toJSON(steps.wrong-commit.outputs) }}
          WRONG_REPOSITORY: ${{ toJSON(steps.wrong-repository.outputs) }}
          WRONG_REF: ${{ toJSON(steps.wrong-ref.outputs) }}
          INVALID_OUTCOMES: ${{ steps.zero-attempts.outcome }} ${{ steps.short-sha.outcome }} ${{ steps.no-packages.outcome }}
        run: |
          set -euo pipefail
          # Each check compares the names and versions that verified and that are missing.
          check() {
            local label=$1 outputs=$2 verified=$3 missing=$4
            if ! jq -e --argjson verified "$verified" --argjson missing "$missing" '
              def ids: map("\(.name)@\(.version)") | sort;
              (.verified | fromjson | ids) == ($verified | sort) and (.missing | fromjson | ids) == ($missing | sort)
            ' <<< "$outputs" > /dev/null; then
              printf '::error::%s: unexpected result %s\n' "$label" "$outputs"
              exit 1
            fi
            printf '%s: passed\n' "$label"
          }
          all='["@luxass/pi-btw@0.2.2","@luxass/pi-questions@0.2.0","@luxass/pi-cost-explorer@0.2.0","@luxass/pi-subagents@0.1.0"]'
          check 'another run attempt' "$WRONG_ATTEMPT" '[]' "$all"
          check 'swapped digests' "$SWAPPED_DIGESTS" '["@luxass/pi-cost-explorer@0.2.0","@luxass/pi-subagents@0.1.0"]' '["@luxass/pi-btw@0.2.2","@luxass/pi-questions@0.2.0"]'
          check 'one unpublished version' "$PARTIAL" "$all" '["@luxass/pi-btw@0.0.0-never-published.1"]'
          check 'another commit' "$WRONG_COMMIT" '[]' "$all"
          check 'another repository' "$WRONG_REPOSITORY" '[]' "$all"
          check 'a branch ref for a tag build' "$WRONG_REF" '[]' '["farver@1.0.0-beta.2"]'
          if [[ "$INVALID_OUTCOMES" != 'failure failure failure' ]]; then
            echo "::error::Expected the invalid inputs to fail. Got: $INVALID_OUTCOMES"
            exit 1
          fi
          echo 'invalid inputs: passed'

  stage-npm-packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: create two packages and a fake pnpm that records each call
        run: |
          set -euo pipefail
          mkdir -p fixtures/app fixtures/core "$RUNNER_TEMP/fake-bin"
          # npm serves neither version, so the action stages both after its 404 check.
          printf '{"name":"cdn-resolve","version":"999.0.0"}\n' > fixtures/app/package.json
          printf '{"name":"@luxass/pi-btw","version":"0.0.0-never-published.1"}\n' > fixtures/core/package.json
          cat > "$RUNNER_TEMP/fake-bin/pnpm" <<'FAKE'
          #!/usr/bin/env bash
          set -euo pipefail
          scenario=$(cat "$RUNNER_TEMP/fake-scenario")
          printf '%s\t%s\n' "${PWD#"$GITHUB_WORKSPACE"/}" "$*" >> "$RUNNER_TEMP/pnpm-$scenario.log"
          name=$(jq -r '.name' package.json)
          if [[ "$scenario" == partial && "$name" == @luxass/pi-btw ]]; then
            echo '{"error":{"code":"E409","summary":"Conflict"}}'
            exit 1
          fi
          if [[ "$scenario" == no-stage-id ]]; then
            jq -n --arg name "$name" '{($name): {integrity: "sha512-missing"}}'
            exit 0
          fi
          integrity="sha512-$(printf '%s' "$name" | openssl dgst -sha512 -binary | base64 -w0)"
          jq -n --arg name "$name" --arg integrity "$integrity" '{($name): {stageId: "stage-\($name | gsub("[^A-Za-z0-9]"; "-"))", integrity: $integrity}}'
          FAKE
          chmod +x "$RUNNER_TEMP/fake-bin/pnpm"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"
          echo success > "$RUNNER_TEMP/fake-scenario"

      - name: stage a stable package and a prerelease
        id: staged
        uses: $/actions/stage-npm-packages
        with:
          packages: >-
            [{"name":"cdn-resolve","version":"999.0.0","directory":"fixtures/app","npm-package-path":"cdn-resolve","dist-tag":"latest"},
            {"name":"@luxass/pi-btw","version":"0.0.0-never-published.1","directory":"fixtures/core","npm-package-path":"%40luxass%2Fpi-btw","dist-tag":"next"}]
          approval-environment: release-approval

      - name: fail the second package
        run: echo partial > "$RUNNER_TEMP/fake-scenario"

      - name: stop when one package fails to stage
        id: partial
        continue-on-error: true
        uses: $/actions/stage-npm-packages
        with:
          packages: >-
            [{"name":"cdn-resolve","version":"999.0.0","directory":"fixtures/app","npm-package-path":"cdn-resolve","dist-tag":"latest"},
            {"name":"@luxass/pi-btw","version":"0.0.0-never-published.1","directory":"fixtures/core","npm-package-path":"%40luxass%2Fpi-btw","dist-tag":"next"}]
          approval-environment: release-approval

      - name: return no stage ID
        run: echo no-stage-id > "$RUNNER_TEMP/fake-scenario"

      - name: refuse a stage result without a stage ID
        id: no-stage-id
        continue-on-error: true
        uses: $/actions/stage-npm-packages
        with:
          packages: '[{"name":"cdn-resolve","version":"999.0.0","directory":"fixtures/app","npm-package-path":"cdn-resolve","dist-tag":"latest"}]'
          approval-environment: release-approval

      - name: try a published version
        run: echo published > "$RUNNER_TEMP/fake-scenario"

      - name: refuse to stage a version that npm already serves
        id: published
        continue-on-error: true
        uses: $/actions/stage-npm-packages
        with:
          packages: '[{"name":"cdn-resolve","version":"3.0.0","directory":"fixtures/app","npm-package-path":"cdn-resolve","dist-tag":"latest"}]'
          approval-environment: release-approval

      - name: check the staging calls and results
        env:
          STAGED: ${{ steps.staged.outputs.packages }}
          INVOCATION_ID: ${{ steps.staged.outputs.invocation-id }}
          OUTCOMES: ${{ steps.partial.outcome }} ${{ steps.no-stage-id.outcome }} ${{ steps.published.outcome }}
        run: |
          set -euo pipefail
          jq -e '
            length == 2
            and .[0].name == "cdn-resolve" and .[0]."dist-tag" == "latest" and .[0].directory == "fixtures/app"
            and .[1].name == "@luxass/pi-btw" and .[1]."dist-tag" == "next" and .[1]."stage-id" == "stage--luxass-pi-btw"
            and all(.[]; (."stage-id" | test("^[A-Za-z0-9_-]+$")) and (.integrity | test("^sha512-[A-Za-z0-9+/]{86}==$")))
          ' <<< "$STAGED" > /dev/null
          [[ "$INVOCATION_ID" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" ]]
          # Each package is staged from its own directory, with its dist-tag, provenance, and no npm token.
          for line in 1 2; do
            entry=$(sed -n "${line}p" "$RUNNER_TEMP/pnpm-success.log")
            case "$line:$entry" in
              1:fixtures/app$'\t'*'--tag latest'*|2:fixtures/core$'\t'*'--tag next'*) ;;
              *) echo "::error::Unexpected pnpm call $line: $entry"; exit 1 ;;
            esac
            for flag in 'stage publish' '--provenance' '--npmrc-auth-file /dev/null' '--access public'; do
              [[ "$entry" == *"$flag"* ]] || { echo "::error::pnpm call $line lacks $flag: $entry"; exit 1; }
            done
          done
          [[ "$(wc -l < "$RUNNER_TEMP/pnpm-success.log")" -eq 2 ]]
          [[ "$(wc -l < "$RUNNER_TEMP/pnpm-partial.log")" -eq 2 ]]
          [[ ! -e "$RUNNER_TEMP/pnpm-published.log" ]]
          if [[ "$OUTCOMES" != 'failure failure failure' ]]; then
            echo "::error::Expected the partial, missing stage ID, and published cases to fail. Got: $OUTCOMES"
            exit 1
          fi
          echo 'Staging passed: both packages staged with the right flags, and the three failure cases failed.'

  create-github-releases:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: create a fake gh that stores tags and releases
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-bin"
          cat > "$RUNNER_TEMP/fake-bin/gh" <<'FAKE'
          #!/usr/bin/env bash
          set -euo pipefail
          state="$RUNNER_TEMP/gh-$(cat "$RUNNER_TEMP/fake-scenario")"
          printf '%s\n' "$*" >> "$state/calls.log"
          if [[ "$1" == api && "$2" == --paginate ]]; then
            cat "$state/releases.json"
          elif [[ "$1" == api && "$2" == */git/ref/tags/* ]]; then
            sha=$(jq -r --arg tag "${2#*/git/ref/tags/}" '.[$tag] // empty' "$state/tags.json")
            if [[ -z "$sha" ]]; then echo 'gh: Not Found (HTTP 404)' >&2; exit 1; fi
            jq -n --arg sha "$sha" '{object: {type: "commit", sha: $sha}}'
          elif [[ "$1" == api && "$2" == */git/refs ]]; then
            jq --arg tag "${4#ref=refs/tags/}" --arg sha "${6#sha=}" '. + {($tag): $sha}' "$state/tags.json" > "$state/tags.tmp"
            mv "$state/tags.tmp" "$state/tags.json"
            echo '{}'
          elif [[ "$1" == release && "$2" == create ]]; then
            tag=$3 prerelease=false latest=true notes=''
            shift 3
            while (( $# > 0 )); do
              case "$1" in
                --prerelease) prerelease=true ;;
                --latest=false) latest=false ;;
                --notes-file) notes=$(cat "$2"); shift ;;
              esac
              shift
            done
            jq --arg tag "$tag" --argjson prerelease "$prerelease" --argjson latest "$latest" --arg notes "$notes" \
              '. + [{tag_name: $tag, draft: false, prerelease: $prerelease, latest: $latest, body: $notes}]' "$state/releases.json" > "$state/releases.tmp"
            mv "$state/releases.tmp" "$state/releases.json"
          else
            echo "unexpected gh call: $*" >&2
            exit 2
          fi
          FAKE
          chmod +x "$RUNNER_TEMP/fake-bin/gh"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"
          for scenario in first conflicts malformed empty; do
            mkdir -p "$RUNNER_TEMP/gh-$scenario"
            echo '[]' > "$RUNNER_TEMP/gh-$scenario/releases.json"
            echo '{}' > "$RUNNER_TEMP/gh-$scenario/tags.json"
          done
          # A draft for the first release and a tag at another commit for the second.
          echo '[{"tag_name":"@scope/a@1.0.0","draft":true}]' > "$RUNNER_TEMP/gh-conflicts/releases.json"
          echo '{"@scope/b@2.0.0-beta.1":"0000000000000000000000000000000000000000"}' > "$RUNNER_TEMP/gh-conflicts/tags.json"
          releases='[{"tag":"@scope/a@1.0.0","version":"1.0.0","notes":"A notes"},{"tag":"@scope/b@2.0.0-beta.1","version":"2.0.0-beta.1","notes":"B notes"},{"tag":"v3.0.0","version":"3.0.0","notes":"### Features\n\n- C notes"}]'
          printf 'RELEASES=%s\n' "$(printf '%s' "$releases" | base64 -w0)" >> "$GITHUB_ENV"
          printf 'EMPTY_RELEASES=%s\n' "$(printf '[]' | base64 -w0)" >> "$GITHUB_ENV"
          echo first > "$RUNNER_TEMP/fake-scenario"

      - name: create three releases
        uses: $/actions/create-github-releases
        with:
          releases: ${{ env.RELEASES }}

      - name: rerun with the same releases
        id: rerun
        uses: $/actions/create-github-releases
        with:
          releases: ${{ env.RELEASES }}

      - name: use the conflicting state
        run: echo conflicts > "$RUNNER_TEMP/fake-scenario"

      - name: continue past a draft and a tag at another commit
        id: conflicts
        continue-on-error: true
        uses: $/actions/create-github-releases
        with:
          releases: ${{ env.RELEASES }}

      - name: use the malformed state
        run: echo malformed > "$RUNNER_TEMP/fake-scenario"

      - name: refuse malformed release data
        id: malformed
        continue-on-error: true
        uses: $/actions/create-github-releases
        with:
          releases: bm90IGpzb24=

      - name: refuse an empty release list
        id: empty
        continue-on-error: true
        uses: $/actions/create-github-releases
        with:
          releases: ${{ env.EMPTY_RELEASES }}

      - name: check the tags and releases
        env:
          OUTCOMES: ${{ steps.rerun.outcome }} ${{ steps.conflicts.outcome }} ${{ steps.malformed.outcome }} ${{ steps.empty.outcome }}
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/gh-first"
          jq -e --arg sha "$GITHUB_SHA" '. == {"@scope/a@1.0.0": $sha, "@scope/b@2.0.0-beta.1": $sha, "v3.0.0": $sha}' "$first/tags.json" > /dev/null
          jq -e '
            length == 3
            and (map(select(.tag_name == "@scope/a@1.0.0" and .prerelease == false and .latest == true and .body == "A notes")) | length) == 1
            and (map(select(.tag_name == "@scope/b@2.0.0-beta.1" and .prerelease == true and .latest == false and .body == "B notes")) | length) == 1
            and (map(select(.tag_name == "v3.0.0" and .prerelease == false and (.body | startswith("### Features")))) | length) == 1
          ' "$first/releases.json" > /dev/null
          # The rerun created no tags or releases.
          [[ "$(grep -c '^release create' "$first/calls.log")" -eq 3 && "$(grep -c '/git/refs ' "$first/calls.log")" -eq 3 ]]
          conflicts="$RUNNER_TEMP/gh-conflicts"
          jq -e '[.[] | select(.draft | not) | .tag_name] == ["v3.0.0"]' "$conflicts/releases.json" > /dev/null
          jq -e --arg sha "$GITHUB_SHA" '."v3.0.0" == $sha and ."@scope/b@2.0.0-beta.1" == "0000000000000000000000000000000000000000"' "$conflicts/tags.json" > /dev/null
          [[ ! -s "$RUNNER_TEMP/gh-malformed/calls.log" ]]
          if [[ "$OUTCOMES" != 'success failure failure failure' ]]; then
            echo "::error::Expected the rerun to pass and the conflicts, malformed, and empty cases to fail. Got: $OUTCOMES"
            exit 1
          fi
          echo 'Releases passed: tags and releases match, the rerun was a no-op, and conflicts only stopped their own package.'
