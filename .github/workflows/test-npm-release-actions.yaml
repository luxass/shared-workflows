name: Test npm Release Actions

on:
  pull_request:
    paths:
      - "actions/stage-npm-packages/**"
      - "actions/verify-npm-packages/**"
      - "actions/create-github-releases/**"
      - ".github/workflows/test-npm-release-actions.yaml"
  push:
    branches:
      - main
    paths:
      - "actions/stage-npm-packages/**"
      - "actions/verify-npm-packages/**"
      - "actions/create-github-releases/**"
      - ".github/workflows/test-npm-release-actions.yaml"

permissions: {}

jobs:
  verify-real-releases:
    name: verify ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        # Each entry is a real release with the run attempt, repository, ref, and commit from its npm provenance.
        include:
          - label: an unscoped package from a manual dispatch
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
          - label: a scoped package from a manual dispatch
            repository: luxass/spectral-ruleset
            ref: refs/heads/main
            sha: b85c5e0bf7fea35e661e51305275c11b29d9b69e
            invocation-id: https://github.com/luxass/spectral-ruleset/actions/runs/45042474801/attempts/1
