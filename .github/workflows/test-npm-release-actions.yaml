name: Test npm Release Actions

on:
  pull_request:
    paths:
      - "actions/stage-npm-packages/**"
      - "actions/verify-npm-packages/**"
      - "actions/create-github-releases/**"
      - ".github/workflows/test-npm-release-actions.yaml"
  push:
    branches:
      - main
    paths:
      - "actions/stage-npm-packages/**"
      - "actions/verify-npm-packages/**"
      - "actions/create-github-releases/**"
      - ".github/workflows/test-npm-release-actions.yaml"

permissions: {}

jobs:
  # Verifies real releases against npm. The run attempt, repository, ref, and commit come from their npm provenance.
  verify:
    name: "verify: ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: accept an unscoped package
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '[]'
          - case: accept a scoped package
            packages: '[{"name":"@luxass/spectral-ruleset","version":"1.1.2","npm-package-path":"%40luxass%2Fspectral-ruleset","integrity":"sha512-l5AjtYAvD6tvV8CKwrmiRBAVXeHFHSxdd7Ye/Ga9VngZOu2rlZF027vXCDzlaPXVtVdFxkcyNSaDS8/WNpA29A=="}]'
            invocation-id: https://github.com/luxass/spectral-ruleset/actions/runs/45042474801/attempts/1
            repository: luxass/spectral-ruleset
            ref: refs/heads/main
            sha: b85c5e0bf7fea35e661e51305275c11b29d9b69e
            missing: '[]'
          - case: accept four workspace packages staged in one run
            packages: '[{"name":"@luxass/pi-btw","version":"0.2.2","npm-package-path":"%40luxass%2Fpi-btw","integrity":"sha512-aMsGm9ccb5P0WyCyYRzCgPcHEn2SJC24s5vXqYb8ZdgYi+NcGss9+GGFUas6lJ+iGje78nDIdhqf3dIPYCUIig=="},{"name":"@luxass/pi-questions","version":"0.2.0","npm-package-path":"%40luxass%2Fpi-questions","integrity":"sha512-hZh89JyH9ARXY+omvvjyrwNuNbZXkfrzIh6Q93XIXJWmD78mLQGAe01ui7E8nP1bRmElQRpnu8Q7GgyXu8XncA=="},{"name":"@luxass/pi-cost-explorer","version":"0.2.0","npm-package-path":"%40luxass%2Fpi-cost-explorer","integrity":"sha512-HWvC5MCY2FvCvxVN/5YjdoaKWdszz/UAgwf6g/jYR4ExVgMa3X78dI5EUllDgF7Opq19gyGjOqFAWUDfErdraQ=="},{"name":"@luxass/pi-subagents","version":"0.1.0","npm-package-path":"%40luxass%2Fpi-subagents","integrity":"sha512-lnE2S1ADfxvsWTTCLW/Zi0VytGrRoGcwE/r13NzJzVw5V2Jb6eFATFbZrF5YuCvBJWvPXHpwQ6O75gZS096g/Q=="}]'
            invocation-id: https://github.com/luxass/agent-extensions/actions/runs/44865055360/attempts/1
            repository: luxass/agent-extensions
            ref: refs/heads/main
            sha: dfa2c8168e8e905c3f84d02f29dd71b19dc54566
            missing: '[]'
          - case: accept a prerelease built from a tag
            packages: '[{"name":"farver","version":"1.0.0-beta.2","npm-package-path":"farver","integrity":"sha512-P8R77f7O6uVvCp/ByoUiQQlPRrLLK+mWlb2o3IqxXyh4PRkt8nIjt+VftuICCE9+gEaRNuz18jG8S0VucvT6rQ=="}]'
            invocation-id: https://github.com/luxass/farver/actions/runs/39092888905/attempts/1
            repository: luxass/farver
            ref: refs/tags/v1.0.0-beta.2
            sha: 6da0f4b239b82cc14f1f5713985b5efa13c6c346
            missing: '[]'
          - case: reject another run attempt
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/2
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '["cdn-resolve@3.0.0"]'
          - case: reject another commit
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: b85c5e0bf7fea35e661e51305275c11b29d9b69e
            missing: '["cdn-resolve@3.0.0"]'
          - case: reject another repository
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/spectral-ruleset
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '["cdn-resolve@3.0.0"]'
          - case: reject a branch ref for a tag build
            packages: '[{"name":"farver","version":"1.0.0-beta.2","npm-package-path":"farver","integrity":"sha512-P8R77f7O6uVvCp/ByoUiQQlPRrLLK+mWlb2o3IqxXyh4PRkt8nIjt+VftuICCE9+gEaRNuz18jG8S0VucvT6rQ=="}]'
            invocation-id: https://github.com/luxass/farver/actions/runs/39092888905/attempts/1
            repository: luxass/farver
            ref: refs/heads/main
            sha: 6da0f4b239b82cc14f1f5713985b5efa13c6c346
            missing: '["farver@1.0.0-beta.2"]'
          - case: reject swapped tarball digests
            packages: '[{"name":"@luxass/pi-btw","version":"0.2.2","npm-package-path":"%40luxass%2Fpi-btw","integrity":"sha512-hZh89JyH9ARXY+omvvjyrwNuNbZXkfrzIh6Q93XIXJWmD78mLQGAe01ui7E8nP1bRmElQRpnu8Q7GgyXu8XncA=="},{"name":"@luxass/pi-questions","version":"0.2.0","npm-package-path":"%40luxass%2Fpi-questions","integrity":"sha512-aMsGm9ccb5P0WyCyYRzCgPcHEn2SJC24s5vXqYb8ZdgYi+NcGss9+GGFUas6lJ+iGje78nDIdhqf3dIPYCUIig=="}]'
            invocation-id: https://github.com/luxass/agent-extensions/actions/runs/44865055360/attempts/1
            repository: luxass/agent-extensions
            ref: refs/heads/main
            sha: dfa2c8168e8e905c3f84d02f29dd71b19dc54566
            missing: '["@luxass/pi-btw@0.2.2","@luxass/pi-questions@0.2.0"]'
          - case: keep the served package when another version is not on npm
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="},{"name":"cdn-resolve","version":"0.0.0-never-published.1","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '["cdn-resolve@0.0.0-never-published.1"]'
          - case: refuse zero attempts
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '[]'
            max-attempts: "0"
            outcome: failure
          - case: refuse a short commit SHA
            packages: '[{"name":"cdn-resolve","version":"3.0.0","npm-package-path":"cdn-resolve","integrity":"sha512-rhRaZanH/3aspp9Kl3I+ZWJNLF450hKA0nJ/uyd/f7Dpdc9e2ZnN2kaJhowGVJnW2Jh5y2LjTRv0j1nP+Z3FmA=="}]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c
            missing: '[]'
            outcome: failure
          - case: refuse an empty package list
            packages: '[]'
            invocation-id: https://github.com/luxass/cdn-resolve/actions/runs/45111042174/attempts/1
            repository: luxass/cdn-resolve
            ref: refs/heads/main
            sha: 5c0563c0f907b4b35573b33e18e6dd6ea49e0706
            missing: '[]'
            outcome: failure
    steps:
      - name: run verify-npm-packages
        id: action
        continue-on-error: ${{ matrix.outcome == 'failure' }}
        uses: $/actions/verify-npm-packages
        with:
          packages: ${{ matrix.packages }}
          invocation-id: ${{ matrix.invocation-id }}
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          sha: ${{ matrix.sha }}
          max-attempts: ${{ matrix.max-attempts || '1' }}
          retry-seconds: "0"

      - name: compare the result with the row
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.outcome || 'success' }}
          PACKAGES: ${{ matrix.packages }}
          EXPECTED_MISSING: ${{ matrix.missing }}
          VERIFIED: ${{ steps.action.outputs.verified }}
          MISSING: ${{ steps.action.outputs.missing }}
        run: |
          set -euo pipefail
          if [[ "$OUTCOME" != "$EXPECTED_OUTCOME" ]]; then
            echo "::error::Expected the action to end with $EXPECTED_OUTCOME. Got $OUTCOME."
            exit 1
          fi
          if [[ "$OUTCOME" == success ]]; then
            # Every package that the row does not list as missing must verify.
            ids='map("\(.name)@\(.version)") | sort'
            expected_verified=$(jq -c --argjson missing "$EXPECTED_MISSING" "$ids - \$missing" <<< "$PACKAGES")
            expected_missing=$(jq -c sort <<< "$EXPECTED_MISSING")
            verified=$(jq -c "$ids" <<< "$VERIFIED")
            missing=$(jq -c "$ids" <<< "$MISSING")
            if [[ "$verified" != "$expected_verified" || "$missing" != "$expected_missing" ]]; then
              echo "::error::Expected verified $expected_verified and missing $expected_missing. Got verified $verified and missing $missing."
              exit 1
            fi
          fi
          echo "The action ended with $OUTCOME as expected."

  # Runs stage-npm-packages with a fake pnpm. The npm checks before staging are real.
  stage:
    name: "stage: ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: stage a stable package and a prerelease
            packages: '[{"name":"cdn-resolve","version":"999.0.0","directory":"fixtures/stable","npm-package-path":"cdn-resolve","dist-tag":"latest"},{"name":"@luxass/pi-btw","version":"0.0.0-never-published.1","directory":"fixtures/prerelease","npm-package-path":"%40luxass%2Fpi-btw","dist-tag":"next"}]'
            calls: '["fixtures/stable latest","fixtures/prerelease next"]'
            outcome: success
          - case: stop when a package fails to stage
            packages: '[{"name":"cdn-resolve","version":"999.0.0","directory":"fixtures/stable","npm-package-path":"cdn-resolve","dist-tag":"latest"},{"name":"@luxass/pi-voice","version":"0.0.0-never-published.1","directory":"fixtures/failing","npm-package-path":"%40luxass%2Fpi-voice","dist-tag":"latest"}]'
            calls: '["fixtures/stable latest","fixtures/failing latest"]'
            outcome: failure
          - case: refuse a result without a stage ID
            packages: '[{"name":"@luxass/pi-whimsical","version":"0.0.0-never-published.1","directory":"fixtures/no-stage-id","npm-package-path":"%40luxass%2Fpi-whimsical","dist-tag":"latest"}]'
            calls: '["fixtures/no-stage-id latest"]'
            outcome: failure
          - case: refuse a version that npm already serves
            packages: '[{"name":"cdn-resolve","version":"3.0.0","directory":"fixtures/published","npm-package-path":"cdn-resolve","dist-tag":"latest"}]'
            calls: '[]'
            outcome: failure
    steps:
      - name: create the fixture packages and a fake pnpm
        run: |
          set -euo pipefail
          for fixture in 'stable cdn-resolve 999.0.0' 'prerelease @luxass/pi-btw 0.0.0-never-published.1' \
            'failing @luxass/pi-voice 0.0.0-never-published.1' 'no-stage-id @luxass/pi-whimsical 0.0.0-never-published.1' \
            'published cdn-resolve 3.0.0'; do
            read -r directory name version <<< "$fixture"
            mkdir -p "fixtures/$directory"
            jq -n --arg name "$name" --arg version "$version" '{name: $name, version: $version}' > "fixtures/$directory/package.json"
          done
          mkdir -p "$RUNNER_TEMP/fake-bin"
          # The fake requires the staging flags, records the directory and dist-tag, and answers like pnpm.
          # The fixture directory decides whether staging fails or returns no stage ID.
          cat > "$RUNNER_TEMP/fake-bin/pnpm" <<'FAKE'
          #!/usr/bin/env bash
          set -euo pipefail
          args=" $* "
          for flag in ' stage publish ' ' --provenance ' ' --npmrc-auth-file /dev/null ' ' --access public '; do
            [[ "$args" == *"$flag"* ]] || { echo "fake pnpm: missing$flag" >&2; exit 3; }
          done
          [[ "$args" =~ \ --tag\ ([a-z]+)\  ]] || { echo 'fake pnpm: missing --tag' >&2; exit 3; }
          directory=${PWD#"$GITHUB_WORKSPACE"/}
          printf '%s %s\n' "$directory" "${BASH_REMATCH[1]}" >> "$RUNNER_TEMP/pnpm-calls.log"
          name=$(jq -r '.name' package.json)
          case "$directory" in
            fixtures/failing) echo '{"error":{"code":"E409","summary":"Conflict"}}'; exit 1 ;;
            fixtures/no-stage-id) jq -n --arg name "$name" '{($name): {}}' ;;
            *)
              integrity="sha512-$(printf '%s' "$name" | openssl dgst -sha512 -binary | base64 -w0)"
              jq -n --arg name "$name" --arg integrity "$integrity" '{($name): {stageId: "fake-stage-id", integrity: $integrity}}'
              ;;
          esac
          FAKE
          chmod +x "$RUNNER_TEMP/fake-bin/pnpm"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"

      - name: run stage-npm-packages
        id: action
        continue-on-error: ${{ matrix.outcome == 'failure' }}
        uses: $/actions/stage-npm-packages
        with:
          packages: ${{ matrix.packages }}
          approval-environment: release-approval

      - name: compare the result with the row
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXPECTED_CALLS: ${{ matrix.calls }}
          PACKAGES: ${{ matrix.packages }}
          STAGED: ${{ steps.action.outputs.packages }}
          INVOCATION_ID: ${{ steps.action.outputs.invocation-id }}
        run: |
          set -euo pipefail
          calls='[]'
          if [[ -f "$RUNNER_TEMP/pnpm-calls.log" ]]; then
            calls=$(jq -Rsc 'split("\n") | map(select(length > 0))' "$RUNNER_TEMP/pnpm-calls.log")
          fi
          if [[ "$OUTCOME" != "$EXPECTED_OUTCOME" || "$calls" != "$(jq -c . <<< "$EXPECTED_CALLS")" ]]; then
            echo "::error::Expected $EXPECTED_OUTCOME with pnpm calls $EXPECTED_CALLS. Got $OUTCOME with $calls."
            exit 1
          fi
          if [[ "$OUTCOME" == success ]]; then
            # Each staged entry keeps its input fields and adds the stage ID and tarball digest.
            jq -en --argjson packages "$PACKAGES" --argjson staged "$STAGED" '
              ($staged | map(del(."stage-id", .integrity))) == $packages
              and all($staged[]; ."stage-id" == "fake-stage-id" and (.integrity | test("^sha512-[A-Za-z0-9+/]{86}==$")))
            ' > /dev/null
            [[ "$INVOCATION_ID" == "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" ]]
          fi
          echo "The action ended with $OUTCOME after the expected pnpm calls."

  # Runs create-github-releases with a fake gh that keeps tags and releases in files.
  release:
    name: "release: ${{ matrix.case }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: create a tag and release for each entry
            input: three
            existing-releases: '[]'
            existing-tags: '{}'
            created: '[{"tag":"@scope/a@1.0.0","prerelease":false,"latest":true},{"tag":"@scope/b@2.0.0-beta.1","prerelease":true,"latest":false},{"tag":"v3.0.0","prerelease":false,"latest":true}]'
            outcome: success
          - case: create nothing on a rerun
            input: three
            existing-releases: '[{"tag_name":"@scope/a@1.0.0","draft":false},{"tag_name":"@scope/b@2.0.0-beta.1","draft":false},{"tag_name":"v3.0.0","draft":false}]'
            existing-tags: '{"@scope/a@1.0.0":"current","@scope/b@2.0.0-beta.1":"current","v3.0.0":"current"}'
            created: '[]'
            outcome: success
          - case: continue past a draft and a tag at another commit
            input: three
            existing-releases: '[{"tag_name":"@scope/a@1.0.0","draft":true}]'
            existing-tags: '{"@scope/b@2.0.0-beta.1":"0000000000000000000000000000000000000000"}'
            created: '[{"tag":"v3.0.0","prerelease":false,"latest":true}]'
            outcome: failure
          - case: refuse malformed release data
            input: malformed
            existing-releases: '[]'
            existing-tags: '{}'
            created: '[]'
            outcome: failure
          - case: refuse an empty release list
            input: empty
            existing-releases: '[]'
            existing-tags: '{}'
            created: '[]'
            outcome: failure
    env:
      RELEASES_INPUT: '[{"tag":"@scope/a@1.0.0","version":"1.0.0","notes":"A notes"},{"tag":"@scope/b@2.0.0-beta.1","version":"2.0.0-beta.1","notes":"B notes"},{"tag":"v3.0.0","version":"3.0.0","notes":"### Features\n\n- C notes"}]'
    steps:
      - name: create the starting state and a fake gh
        env:
          INPUT: ${{ matrix.input }}
          EXISTING_RELEASES: ${{ matrix.existing-releases }}
          EXISTING_TAGS: ${{ matrix.existing-tags }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/gh"
          mkdir -p "$state" "$RUNNER_TEMP/fake-bin"
          printf '%s' "$EXISTING_RELEASES" > "$state/releases.json"
          jq --arg sha "$GITHUB_SHA" 'map_values(if . == "current" then $sha else . end)' <<< "$EXISTING_TAGS" > "$state/tags.json"
          echo '{}' > "$state/created-tags.json"
          echo '[]' > "$state/created-releases.json"
          # The fake answers the calls that the action makes, and records the tags and releases it creates.
          cat > "$RUNNER_TEMP/fake-bin/gh" <<'FAKE'
          #!/usr/bin/env bash
          set -euo pipefail
          state="$RUNNER_TEMP/gh"
          printf '%s\n' "$*" >> "$state/calls.log"
          update() { jq "${@:2}" "$state/$1" > "$state/$1.tmp" && mv "$state/$1.tmp" "$state/$1"; }
          if [[ "$1 $2" == 'api --paginate' ]]; then
            cat "$state/releases.json"
          elif [[ "$1" == api && "$2" == */git/ref/tags/* ]]; then
            sha=$(jq -r --arg tag "${2#*/git/ref/tags/}" '.[$tag] // empty' "$state/tags.json")
            [[ -n "$sha" ]] || { echo 'gh: Not Found (HTTP 404)' >&2; exit 1; }
            jq -n --arg sha "$sha" '{object: {type: "commit", sha: $sha}}'
          elif [[ "$1" == api && "$2" == */git/refs ]]; then
            tag=${4#ref=refs/tags/} sha=${6#sha=}
            update tags.json --arg tag "$tag" --arg sha "$sha" '. + {($tag): $sha}'
            update created-tags.json --arg tag "$tag" --arg sha "$sha" '. + {($tag): $sha}'
            echo '{}'
          elif [[ "$1 $2" == 'release create' ]]; then
            tag=$3 prerelease=false latest=true notes=''
            shift 3
            while (( $# > 0 )); do
              case "$1" in
                --prerelease) prerelease=true ;;
                --latest=false) latest=false ;;
                --notes-file) notes=$(cat "$2"); shift ;;
              esac
              shift
            done
            update releases.json --arg tag "$tag" '. + [{tag_name: $tag, draft: false}]'
            update created-releases.json --arg tag "$tag" --argjson prerelease "$prerelease" --argjson latest "$latest" --arg notes "$notes" \
              '. + [{tag: $tag, prerelease: $prerelease, latest: $latest, notes: $notes}]'
          else
            echo "fake gh: unexpected call: $*" >&2
            exit 2
          fi
          FAKE
          chmod +x "$RUNNER_TEMP/fake-bin/gh"
          echo "$RUNNER_TEMP/fake-bin" >> "$GITHUB_PATH"
          case "$INPUT" in
            three) encoded=$(printf '%s' "$RELEASES_INPUT" | base64 -w0) ;;
            empty) encoded=$(printf '[]' | base64 -w0) ;;
            malformed) encoded=$(printf 'not json' | base64 -w0) ;;
          esac
          printf 'RELEASES=%s\n' "$encoded" >> "$GITHUB_ENV"

      - name: run create-github-releases
        id: action
        continue-on-error: ${{ matrix.outcome == 'failure' }}
        uses: $/actions/create-github-releases
        with:
          releases: ${{ env.RELEASES }}

      - name: compare the result with the row
        env:
          OUTCOME: ${{ steps.action.outcome }}
          EXPECTED_OUTCOME: ${{ matrix.outcome }}
          EXPECTED_CREATED: ${{ matrix.created }}
          INPUT: ${{ matrix.input }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/gh"
          created=$(jq -c 'map({tag, prerelease, latest}) | sort_by(.tag)' "$state/created-releases.json")
          expected=$(jq -c 'sort_by(.tag)' <<< "$EXPECTED_CREATED")
          if [[ "$OUTCOME" != "$EXPECTED_OUTCOME" || "$created" != "$expected" ]]; then
            echo "::error::Expected $EXPECTED_OUTCOME with releases $expected. Got $OUTCOME with $created."
            exit 1
          fi
          # Each created release has a new tag at the run's commit and the notes from the input.
          jq -en --arg sha "$GITHUB_SHA" --argjson releases "$(cat "$state/created-releases.json")" --argjson input "$RELEASES_INPUT" '
            input as $tags
            | ($tags | keys | sort) == ($releases | map(.tag) | sort)
            and all($tags[]; . == $sha)
            and all($releases[]; .tag as $tag | .notes == ($input[] | select(.tag == $tag) | .notes))
          ' "$state/created-tags.json" > /dev/null
          if [[ "$INPUT" != three && -e "$state/calls.log" ]]; then
            echo '::error::The action called gh before it validated the release data.'
            exit 1
          fi
          echo "The action ended with $OUTCOME and created $created."
