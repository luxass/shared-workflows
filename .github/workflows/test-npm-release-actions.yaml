          - label: a scoped prerelease built from a tag
            repository: luxass/eslint-config
            ref: refs/tags/v8.0.0-beta.1
            sha: 8faec4b73cbdccc5e7aa6cedfdb1181bd9c497dc
            invocation-id: https://github.com/luxass/eslint-config/actions/runs/34742723671/attempts/1
            packages: '[{"name":"@luxass/eslint-config","version":"8.0.0-beta.1","npm-package-path":"%40luxass%2Feslint-config","integrity":"sha512-4CpI+ZH3YeUWhnSh9AXQUTsJgTKX2OD7+Utrgarxv94Mt+UEJaFw3LoLDq6SmskLdjZcewEi6WycCGkH8z7zDQ=="}]'
    steps:
      - name: verify the release against npm
        id: verify
        uses: $/actions/verify-npm-packages
        with:
          packages: ${{ matrix.packages }}
          invocation-id: ${{ matrix.invocation-id }}
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          sha: ${{ matrix.sha }}
          max-attempts: "1"
          retry-seconds: "0"

      - name: require every package to verify
        env:
          PACKAGES: ${{ matrix.packages }}
          VERIFIED: ${{ steps.verify.outputs.verified }}
          MISSING: ${{ steps.verify.outputs.missing }}
        run: |
          set -euo pipefail
          jq -en --argjson expected "$PACKAGES" --argjson verified "$VERIFIED" --argjson missing "$MISSING" \
            '($verified | sort_by(.name, .version)) == ($expected | sort_by(.name, .version)) and $missing == []' > /dev/null
          printf 'Verified %s package(s).\n' "$(jq length <<< "$VERIFIED")"

