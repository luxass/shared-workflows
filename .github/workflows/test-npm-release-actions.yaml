            sha: ea8251a985dee60c77a0b3c055f3186b29080ce7
            invocation-id: https://github.com/luxass/apache-autoindex-parse/actions/runs/45042474922/attempts/1
            packages: '[{"name":"apache-autoindex-parse","version":"5.0.3","npm-package-path":"apache-autoindex-parse","integrity":"sha512-it00/arwN4BIqbVfX2uH80guDnWm79xFB41UaegWmR+GaIGxQhUNIrZP9dgg9zgyWVsngNtkvw48EPFJ0lCT6A=="}]'
          - label: jsonc-parse from a manual dispatch
            repository: luxass/jsonc-parse
            ref: refs/heads/main
            sha: 2229c88e9f10f1d1e15ec6034ffb0cd9d38e8a6e
