            sha: c8497792edfc2e74591f412f85ae140b17042b76
            invocation-id: https://github.com/luxass/agent-extensions/actions/runs/44978969691/attempts/1
            packages: '[{"name":"@luxass/pi-subagents","version":"0.1.1","npm-package-path":"%40luxass%2Fpi-subagents","integrity":"sha512-4zl/mntjOkLy6vJqsChJmp3fB6qxtaajJ2RZGl9DkTvQcSlMYm+821AKf4+AWXAtBaYPingWJCesncw5XvDw3g=="}]'
          - label: an unscoped prerelease built from a tag
