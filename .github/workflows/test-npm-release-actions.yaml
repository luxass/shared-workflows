          - label: commit-parser from a manual dispatch
            repository: luxass/commit-parser
            ref: refs/heads/main
            sha: f1bd10d081a88a20a4c828d1700c1fc74ac6ba8c
            invocation-id: https://github.com/luxass/commit-parser/actions/runs/45042475390/attempts/1
            packages: '[{"name":"commit-parser","version":"1.3.2","npm-package-path":"commit-parser","integrity":"sha512-/S5hqzCi7/eeLsE3m9rD7n35LYKHKQOxUSJJgsSaBeqW7Q2rPaP7mewJUfxVMT6yDlhEJIrfsY6Ffufzx3yQRw=="}]'
          - label: apache-autoindex-parse from a manual dispatch
            repository: luxass/apache-autoindex-parse
