            packages: '[{"name":"jsonc-parse","version":"2.1.1","npm-package-path":"jsonc-parse","integrity":"sha512-c5QJkzlruD0fsHfCMmAcHVfCzGEO9s93sT8oOOOFiet+a2lf3GrcZEjw4GE9vJ298/iuAyLoPxcUb4fBMM2qsQ=="}]'
          - label: vitest-testdirs from a manual dispatch
            repository: luxass/vitest-testdirs
