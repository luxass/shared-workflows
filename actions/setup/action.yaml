name: "Setup"
description: "Checkout, setup pnpm, setup Node.js, and install dependencies with safe pnpm argument handling"

inputs:
  # checkout inputs
  token:
    description: "GitHub token to use for checkout (defaults to GITHUB_TOKEN)"
    default: ${{ github.token }}
    required: false
  persist-credentials:
    description: "Whether to persist git credentials after checkout"
    default: "false"
    required: false
  fetch-depth:
    description: "Number of commits to fetch (0 for full history)"
    default: "1"
    required: false
  submodules:
    description: "Whether to checkout submodules: `true` to checkout submodules or `recursive` to recursively checkout submodules"
    default: "false"
    required: false

  # node inputs
  node-version:
    description: "Node.js version to use"
    default: "lts/*"
    required: false
  node-version-file:
    description: "File containing the version spec (e.g. .nvmrc, .node-version, package.json)"
    default: ""
    required: false
  registry-url:
    description: "Registry URL to configure for authentication (e.g. https://npm.pkg.github.com)"
    default: ""
    required: false
  scope:
    description: "Scope for authenticating against scoped registries (e.g. @myorg)"
    default: ""
    required: false

  # install inputs
  install-args:
    description: "Additional arguments to pass to pnpm install"
    default: ""
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        token: ${{ inputs.token }}
        persist-credentials: ${{ inputs.persist-credentials }}
        fetch-depth: ${{ inputs.fetch-depth }}
        submodules: ${{ inputs.submodules }}

    - name: setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: setup node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.scope }}

    - name: install dependencies
      uses: luxass/shared-workflows/actions/run-pnpm@82c9e3625f7959ea6b3ddd2014a8a095a269e8f7 # actions/run-pnpm/v0.2.1
      with:
        args: install --frozen-lockfile ${{ inputs.install-args }}
