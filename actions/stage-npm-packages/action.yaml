name: Stage npm Packages
description: Stage npm packages with provenance from their directories, and record each stage ID and tarball digest

inputs:
  packages:
    description: >-
      JSON array of the packages to stage. Each entry needs name, version, directory (relative to the workspace),
      npm-package-path (the URL-encoded name), and dist-tag.
    required: true
  approval-environment:
    description: GitHub environment that the job summary asks the maintainer to approve after npm.
    required: true

outputs:
  packages:
    description: JSON array of the staged packages. Each entry adds stage-id and integrity to the input entry.
    value: ${{ steps.stage.outputs.packages }}
  invocation-id:
    description: The workflow run attempt that npm records in the provenance of each staged package.
    value: ${{ steps.stage.outputs.invocation-id }}

runs:
  using: composite
  steps:
    - name: stage each package on npm and record its ID
      id: stage
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        APPROVAL_ENVIRONMENT: ${{ inputs.approval-environment }}
      run: |
        set -euo pipefail
        registry=https://registry.npmjs.org
        staged='[]'

        # List the stages that this run cannot finalize, so nobody approves them on npm.
        fail() {
          printf '::error::%s\n' "$1"
          if [[ "$(jq length <<< "$staged")" != 0 ]]; then
            {
              printf '## Staged before the failure\n\n'
              printf 'Do not approve these stages on npm. This run cannot finalize them.\n\n'
              jq -r '.[] | "- `\(.name)@\(.version)`: stage ID \(."stage-id")"' <<< "$staged"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 1
        }

        if ! jq -e 'type == "array" and length > 0' <<< "$PACKAGES" > /dev/null; then
          fail 'Expected a JSON list of packages to stage.'
        fi
        while IFS= read -r package; do
          name=$(jq -r '.name' <<< "$package")
          version=$(jq -r '.version' <<< "$package")
          directory=$(jq -r '.directory' <<< "$package")
          npm_package_path=$(jq -r '."npm-package-path"' <<< "$package")
          dist_tag=$(jq -r '."dist-tag"' <<< "$package")
          if ! status=$(curl --silent --show-error --max-time 15 --header 'Cache-Control: no-cache' \
            --output /dev/null --write-out '%{http_code}' "$registry/$npm_package_path/$version"); then
            fail "Could not check npm for $name@$version. See the curl error above."
          fi
          if [[ "$status" != 404 ]]; then
            fail "Expected npm to return 404 for $name@$version before staging. Got HTTP $status."
          fi
          # Stage from the package directory, so each package gets its own dist-tag.
          if ! stage_result=$(cd "$directory" && pnpm stage publish --registry "$registry/" --npmrc-auth-file /dev/null \
            --access public --no-git-checks --tag "$dist_tag" --provenance --use-stderr --json); then
            # Some pnpm versions report failures as JSON on stdout instead of stderr.
            jq -c '.error // empty' <<< "$stage_result" >&2 || true
            fail "npm staging failed for $name@$version. Inspect npm before trying again."
          fi
          if ! stage_id=$(jq -er --arg name "$name" '.[$name].stageId | strings | select(test("^[A-Za-z0-9_-]+$"))' <<< "$stage_result") ||
             ! integrity=$(jq -er --arg name "$name" '.[$name].integrity | strings | select(test("^sha512-[A-Za-z0-9+/]{86}==$"))' <<< "$stage_result"); then
            fail "pnpm did not return a stage ID and a tarball digest for $name@$version. Inspect npm before trying again."
          fi
          staged=$(jq -c --argjson package "$package" --arg stage_id "$stage_id" --arg integrity "$integrity" \
            '. + [$package + {"stage-id": $stage_id, integrity: $integrity}]' <<< "$staged")
          printf 'Staged %s@%s with ID %s\n' "$name" "$version" "$stage_id"
        done < <(jq -c '.[]' <<< "$PACKAGES")

        printf 'packages=%s\n' "$staged" >> "$GITHUB_OUTPUT"
        printf 'invocation-id=%s/%s/actions/runs/%s/attempts/%s\n' \
          "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
        {
          printf '## Ready for npm approval\n\n'
          printf 'Approve each stage ID on its package page under **Staged Packages** with npm 2FA, in this order:\n\n'
          jq -r '.[] | "- [`\(.name)@\(.version)`](https://www.npmjs.com/package/\(.name)): stage ID \(."stage-id")"' <<< "$staged"
          printf '\nThen approve the pending %s environment in this run.\n' "$APPROVAL_ENVIRONMENT"
          printf 'The Git tags and GitHub releases wait until npm serves each package from this run.\n'
        } >> "$GITHUB_STEP_SUMMARY"
