name: Release workspace (npm staging)

on:
  workflow_dispatch:
    inputs:
      expected-sha:
        description: Optional exact commit SHA for automated dispatches
        type: string
        required: false

permissions: {}

concurrency:
  group: npm-staged-release
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged-workspace.yaml@v0.16.0 # x-release-please-version
    with:
      expected-sha: ${{ inputs.expected-sha }}
