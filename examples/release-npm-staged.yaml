name: Release (npm staging)

on:
  workflow_dispatch:
    inputs:
      release-notes:
        description: Markdown for the GitHub release
        type: string
        required: true

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
    uses: luxass/shared-workflows/.github/workflows/reusable-release-npm-staged.yaml@v0.15.0 # x-release-please-version
    with:
      release-notes: ${{ inputs.release-notes }}
