name: Tailscale

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions: {}

jobs:
  tailnet:
    permissions:
      id-token: write
      contents: read
    # A job that calls a reusable workflow cannot set `environment`. The reusable
    # workflow declares the `tailnet` environment itself, through its own
    # `environment` input. Its secrets are still readable here, so every secret
    # below can stay a `tailnet` environment secret.
    uses: luxass/shared-workflows/.github/workflows/reusable-tailscale.yaml@v0.14.0 # x-release-please-version
    with:
      tags: tag:ci
      ping: app.example.ts.net
      # The workflow sets this environment itself, through its own `environment`
      # input. It defaults to `tailnet`.
      environment: tailnet
      # `script` runs a file from this repository with `bash`, once the tailnet
      # is up. It is the way to run your own checks, such as a service health
      # request, since a job that calls a reusable workflow cannot declare its
      # own steps. The job's `id-token: write` is in scope for it, so point it
      # at a script on a ref you trust.
      # script: .github/tailscale/smoke.sh
    secrets:
      oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      audience: ${{ secrets.TS_AUDIENCE }}
      # `script-env` is sourced as shell before the script runs, so the script
      # sees these as ordinary environment variables. It goes here rather than
      # in `with:` because `with:` cannot read the `secrets` context. It is
      # scoped to the script step, so the Tailscale step never sees these.
      script-env: |
        RELAY_TOKEN=${{ secrets.RELAY_TOKEN }}
        RELAY_TO=${{ vars.RELAY_TO }}
